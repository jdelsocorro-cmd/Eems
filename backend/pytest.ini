[pytest]
# Function scope matches what was already happening implicitly (each test
# gets its own event loop) -- set explicitly to silence pytest-asyncio's
# "asyncio_default_fixture_loop_scope is unset" deprecation warning and to
# stop this from silently changing to a different default in a future
# pytest-asyncio release. Note this setting only affects async *fixtures*
# (e.g. tests/integration/conftest.py's engine-disposal fixture) -- plain
# @pytest.mark.asyncio test functions are function-scoped regardless of
# this value unless a test explicitly passes loop_scope= on the marker.
asyncio_default_fixture_loop_scope = function
