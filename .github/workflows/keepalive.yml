name: Keep-alive

# Two independent free-tier sleep problems, two schedules in one file --
# GitHub puts the cron expression that actually fired in
# github.event.schedule, so each job only runs on its own cadence even
# though both are declared under one `on.schedule` list.
#
# 1. Render's free-tier web service (eems-backend) spins down after 15
#    minutes with no HTTP traffic; the next real request then eats a cold
#    boot (container start + uvicorn + first DB connection), which is
#    routinely 30-90s. That was originally an accepted tradeoff for staying
#    on the free tier (see health.py's prior docstring) -- revisited here
#    because that cold start is exactly the "loading takes some time"
#    Jayson hit in real use. Pinged every 10 minutes, safely inside the
#    15-minute window with buffer for GitHub's scheduling jitter.
# 2. Supabase free-tier projects auto-pause after 7 days with no activity --
#    a full outage of the whole app, not a UX inconvenience, so this runs
#    well inside that window. A scheduled trigger alone is one failure
#    domain (GitHub occasionally delays or, per its docs, can disable cron
#    on a repo with no commits in 60+ days) -- see the README note in this
#    repo's task list for the second, independent cron-job.org trigger that
#    covers the same endpoint from outside GitHub entirely.
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  ping-render:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Hit the backend's own health endpoint (proves web process + DB connection are both alive)
        run: |
          # eems-backend-sg (Singapore, matching Supabase's ap-southeast-1)
          # replaced the original eems-qhnt/eems-backend service (Oregon,
          # no region set) on 2026-09-08 -- a diagnostic endpoint confirmed
          # the Oregon service was paying real cross-Pacific latency on
          # every DB round trip, compounding badly on any endpoint running
          # several sequential queries.
          status=$(curl -s -o /dev/null -w "%{http_code}" https://eems-backend-sg.onrender.com/health)
          echo "Render backend responded: $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "Unexpected status from Render backend -- may be down."
            exit 1
          fi

  ping-supabase:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */12 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Hit a real PostgREST query (not just a static endpoint)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase REST responded: $status"
          # 200 (rows) or 401/403 (RLS correctly blocking an unauthenticated
          # read) both prove the project is awake and responding -- only
          # fail the job on something that suggests it's actually down.
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "Unexpected status from Supabase -- project may be down or paused."
            exit 1
          fi

  ping-supabase-dev:
    # eems-dev (see docs/PROD_DATA_SAFETY.md) has no traffic of its own --
    # nothing but occasional manual test runs ever hits it -- so unlike
    # production above, it was never covered by an existing keepalive.
    # NOTE: this is NOT what caused the 2026-09-08 "eems-dev looks empty"
    # scare -- that turned out to be scripts/restore_drill.sh's pg_restore
    # stripping eems_app's schema grants, unrelated to project pause state,
    # already root-caused and fixed (see
    # [[eems-dev-db-grants-stripped]]/commit d41dff0, which also added a
    # same-day sanity check for exactly that failure mode). This job exists
    # only because free-tier auto-pause-after-7-days-idle is a real,
    # separate, still-unmitigated risk for eems-dev specifically -- cheap
    # to close given the production job already exists as a template.
    # Needs its own secrets (SUPABASE_DEV_URL/SUPABASE_DEV_ANON_KEY) since
    # eems-dev is a different project from the one SUPABASE_URL/
    # SUPABASE_ANON_KEY point at above -- add them under repo Settings ->
    # Secrets and variables -> Actions using the values already in
    # eems/frontend/.env or eems/backend/.env (VITE_SUPABASE_URL/
    # VITE_SUPABASE_ANON_KEY or SUPABASE_URL/SUPABASE_ANON_KEY -- confirm
    # against the eems-dev ref, not production, before pasting). The anon
    # key is safe to store this way; it's already meant to be public
    # client-side.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */12 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Hit a real PostgREST query against eems-dev
        run: |
          if [ -z "${{ secrets.SUPABASE_DEV_URL }}" ]; then
            echo "SUPABASE_DEV_URL secret not set yet -- skipping until it's added."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_DEV_URL }}/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_DEV_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_ANON_KEY }}")
          echo "eems-dev Supabase REST responded: $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "Unexpected status from eems-dev Supabase -- project may be down or paused."
            exit 1
          fi
