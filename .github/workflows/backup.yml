name: Nightly backup

# The Supabase free tier caps the DB at 500MB, so dumps stay small -- this
# is a plain pg_dump, not anything that needs chunking. Two independent
# copies on purpose: R2 (10GB free, no egress fees, meant to be the durable
# one) and a GitHub Actions artifact (short-retention, but a second storage
# provider entirely -- if R2 credentials break silently, this still lands).
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu's default `postgresql-client` package is version 16, but the
      # Supabase project is on Postgres 17.6 -- pg_dump refuses to dump from
      # a server newer than itself (a built-in safety check, found live
      # while restoring this workflow to working order on 2026-09-05).
      # Installing from the official PGDG apt repo instead of Ubuntu's own
      # gets a client version that actually matches.
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump the database
        run: |
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "DUMP_FILE=eems-backup-${timestamp}.dump" >> "$GITHUB_ENV"
          # Explicit version-specific path -- installing postgresql-client-17
          # alongside Ubuntu's own already-present v16 package left plain
          # `pg_dump` on PATH still resolving to v16 (the runner's default
          # alternatives didn't switch), found live while restoring this
          # workflow to working order on 2026-09-05.
          #
          # -n public -n app: an actual restore drill (same day) surfaced
          # that an unscoped pg_dump also dumps Supabase's own internal
          # schemas (auth, storage, etc.) -- which already exist by default
          # on every Supabase project, so restoring them collided with a
          # "CREATE SCHEMA auth already exists" error and the restore never
          # completed. This app's own data lives only in public/app; those
          # are the only schemas this backup needs to protect.
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_ADMIN_URL }}" -n public -n app -F c -f "eems-backup-${timestamp}.dump"

      # A production readiness review (2026-09-05) found every run of this
      # workflow had been failing since it was added -- SUPABASE_DB_ADMIN_URL
      # and all four R2_* secrets were never actually set on this repo, so
      # pg_dump silently fell back to a local socket connection and failed
      # immediately. That's now fixed by actually setting the secrets, but a
      # second, independent bug was found at the same time: this R2 upload
      # step had no `continue-on-error`, so if it ever fails again for any
      # reason (an expired token, a renamed bucket), the artifact step below
      # would never even run -- silently defeating the "two independent
      # copies, in case R2 breaks" design this workflow's own comment
      # documents. continue-on-error here means a broken R2 upload no longer
      # takes the GitHub artifact copy down with it.
      - name: Upload to Cloudflare R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$DUMP_FILE" "s3://${{ secrets.R2_BUCKET_NAME }}/$DUMP_FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Upload redundant copy as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_FILE }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 14
